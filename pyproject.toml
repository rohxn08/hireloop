[project]
name = "hireloop"
version = "0.2.0"
description = "A small, token-lean MCP server that finds and applies to jobs on Wellfound and Indeed, with fact-checked answers and human-speed browsing."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp>=1.27,<2",
  "playwright>=1.54,<2",
]

[project.scripts]
hireloop = "hireloop.server:main"
hireloop-login = "hireloop.login:main"
hireloop-test-email = "hireloop.notify:test_main"
hireloop-dashboard = "hireloop.dashboard:main"
hireloop-weekly-report = "hireloop.weekly:main"
# Old name, so an MCP registered before the rename keeps starting.
wellfound-mcp = "hireloop.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hireloop"]

[dependency-groups]
dev = ["pytest>=8"]
